<link rel="stylesheet" href="xterm.vendor.css">
<style>html,body{height:100%;margin:0;overflow:hidden;background:#0d1014}#t{position:absolute;inset:6px 0 0 10px}.xterm-viewport{background:transparent!important}</style>
<div id="t"></div>
<script src="xterm.vendor.js"></script>
<script src="addon-fit.vendor.js"></script>
<script>
const el=document.getElementById('t'),post=m=>neoWindow.postMessage(m);
const term=new Terminal({fontFamily:'ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace',fontSize:14,cursorBlink:true,scrollback:10000,allowProposedApi:true,
 theme:{background:'#0d1014',foreground:'#d7dde4',cursor:'#d7dde4',selectionBackground:'#3b4a63'}});
const fit=new FitAddon.FitAddon();term.loadAddon(fit);term.open(el);fit.fit();
function copy(s){const ta=document.createElement('textarea');ta.value=s;ta.style.cssText='position:fixed;opacity:0';document.body.append(ta);ta.select();document.execCommand('copy');ta.remove();term.focus()}
term.attachCustomKeyEventHandler(e=>{if(e.type==='keydown'&&e.code==='KeyC'&&((e.ctrlKey&&e.shiftKey)||e.metaKey)&&term.hasSelection()){copy(term.getSelection());return false}return true});
term.onData(d=>post({input:d}));
term.onResize(({cols,rows})=>post({resize:{cols,rows}}));
let raf=0;new ResizeObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{try{fit.fit()}catch{}})}).observe(el);
neoWindow.onMessage(m=>{if(m.data)term.write(m.data)});
addEventListener('focus',()=>term.focus());el.addEventListener('mousedown',()=>setTimeout(()=>term.focus(),0));
post({ready:true,cols:term.cols,rows:term.rows});term.focus();
</script>
