<style>
body{height:100vh;display:flex;flex-direction:column;overflow:hidden}.tools{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--neo-border)}.tools label{font-size:.85rem;color:var(--neo-text-muted)}.tools input[type=range]{width:90px}.canvas-wrap{flex:1;min-height:0;padding:16px;background:var(--neo-surface-0);display:grid;place-items:center}canvas{background:white;width:100%;height:100%;max-height:100%;touch-action:none;box-shadow:var(--neo-shadow-2)}#status{padding:4px 10px;color:var(--neo-text-muted);font-size:.85rem}
</style>
<div class="tools"><label>Color <input id="color" type="color" value="#18233a"></label><label>Brush <input id="size" type="range" min="1" max="48" value="6"></label><button id="clear" class="neo-btn">Clear</button><button id="save" class="neo-btn neo-btn--primary">Save to Files</button></div>
<div class="canvas-wrap"><canvas id="canvas" width="1200" height="760" aria-label="Drawing canvas"></canvas></div><div id="status">Draw with your mouse or touch.</div>
<script>
const c=document.getElementById('canvas'),ctx=c.getContext('2d'),statusEl=document.getElementById('status'),colorEl=document.getElementById('color'),sizeEl=document.getElementById('size');let drawing=false;ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.lineCap='round';ctx.lineJoin='round';function point(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};c.onpointermove=e=>{if(!drawing)return;const p=point(e);ctx.strokeStyle=colorEl.value;ctx.lineWidth=+sizeEl.value*c.width/c.clientWidth;ctx.lineTo(p.x,p.y);ctx.stroke()};c.onpointerup=c.onpointercancel=()=>drawing=false;document.getElementById('clear').onclick=()=>{ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);statusEl.textContent='Canvas cleared.'};document.getElementById('save').onclick=()=>c.toBlob(async blob=>{if(!blob)return;const bytes=new Uint8Array(await blob.arrayBuffer());neoWindow.postMessage({save:bytes});statusEl.textContent='Saving drawing…'},'image/png');neoWindow.onMessage(m=>{if(m.saved)statusEl.textContent=`Saved ${m.saved} to /`});
</script>
