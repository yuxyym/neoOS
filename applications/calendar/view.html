<style>
body{height:100vh;display:grid;grid-template-columns:1.3fr 1fr;overflow:hidden}.calendar{padding:20px;display:flex;flex-direction:column;gap:14px}.heading{display:flex;align-items:center;gap:8px}.heading h1{font-size:1.25rem;flex:1;margin:0}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day,.date{display:grid;place-items:center;min-height:38px;border-radius:8px}.day{font-size:.8rem;color:var(--neo-text-muted)}.date{border:0;background:transparent;color:var(--neo-text);cursor:pointer}.date:hover,.date.selected{background:var(--neo-accent);color:white}.date.today{outline:1px solid var(--neo-accent)}.agenda{padding:22px;border-inline-start:1px solid var(--neo-border);background:var(--neo-surface-0);overflow:auto}.agenda h2{font-size:1.05rem}.agenda-form{display:flex;gap:8px;margin:16px 0}.agenda-form input{min-width:0;flex:1}.event{display:flex;justify-content:space-between;gap:8px;padding:10px;border-bottom:1px solid var(--neo-border)}
</style>
<section class="calendar"><div class="heading"><button id="prev" class="neo-btn" aria-label="Previous month">‹</button><h1 id="month"></h1><button id="next" class="neo-btn" aria-label="Next month">›</button><button id="today" class="neo-btn">Today</button></div><div class="grid" id="grid"></div></section>
<aside class="agenda"><h2 id="selected-date"></h2><form id="event-form" class="agenda-form"><input id="event-title" class="neo-input" placeholder="Add an event" maxlength="120" required><button class="neo-btn neo-btn--primary">Add</button></form><div id="events"></div></aside>
<script>
const now=new Date();let monthCursor=new Date(now.getFullYear(),now.getMonth(),1),selected=new Date(now.getFullYear(),now.getMonth(),now.getDate()),events=[];
const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function render(){document.getElementById('month').textContent=monthDate(monthCursor);const grid=document.getElementById('grid');grid.replaceChildren();['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(x=>{const e=document.createElement('span');e.className='day';e.textContent=x;grid.append(e)});const offset=monthCursor.getDay(),count=new Date(monthCursor.getFullYear(),monthCursor.getMonth()+1,0).getDate();for(let i=0;i<offset;i++)grid.append(document.createElement('span'));for(let day=1;day<=count;day++){const d=new Date(monthCursor.getFullYear(),monthCursor.getMonth(),day),b=document.createElement('button');b.className='date'+(key(d)===key(selected)?' selected':'')+(key(d)===key(now)?' today':'');b.textContent=day;b.onclick=()=>{selected=d;render()};grid.append(b)}document.getElementById('selected-date').textContent=selected.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric',year:'numeric'});const list=events.filter(e=>e.date===key(selected));document.getElementById('events').replaceChildren(...list.map(item=>{const row=document.createElement('div');row.className='event';const text=document.createElement('span');text.textContent=item.title;const del=document.createElement('button');del.className='neo-btn neo-btn--ghost';del.textContent='Delete';del.onclick=()=>save(events.filter(e=>e.id!==item.id));row.append(text,del);return row}))}
function monthDate(d){return d.toLocaleDateString([], {month:'long',year:'numeric'})}function save(next){events=next;render();neoWindow.postMessage({events})}
document.getElementById('prev').onclick=()=>{monthCursor=new Date(monthCursor.getFullYear(),monthCursor.getMonth()-1,1);render()};document.getElementById('next').onclick=()=>{monthCursor=new Date(monthCursor.getFullYear(),monthCursor.getMonth()+1,1);render()};document.getElementById('today').onclick=()=>{selected=new Date();monthCursor=new Date(selected.getFullYear(),selected.getMonth(),1);render()};document.getElementById('event-form').onsubmit=e=>{e.preventDefault();const input=document.getElementById('event-title'),title=input.value.trim();if(!title)return;save([...events,{id:`${Date.now()}-${Math.random()}`,date:key(selected),title}]);input.value=''};
neoWindow.onMessage(m=>{if(m.events){events=m.events;render()}});render();
</script>
