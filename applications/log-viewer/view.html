<style>body{height:100vh;display:flex;flex-direction:column;overflow:hidden}header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--neo-border)}select{font:inherit;color:var(--neo-text);background:var(--neo-surface-0);border:1px solid var(--neo-border);border-radius:6px;padding:6px}.entries{flex:1;overflow:auto;padding:4px 12px}article{display:grid;grid-template-columns:145px 55px 130px 1fr;gap:8px;padding:7px 4px;border-bottom:1px solid var(--neo-border);font-family:var(--neo-font-mono);font-size:.82rem}.error{color:var(--neo-danger)}.warn{color:#e0aa3e}.muted{color:var(--neo-text-muted)}</style>
<header><strong>Recent system and app events</strong><select id="filter" aria-label="Filter log level"><option value="all">All levels</option><option>error</option><option>warn</option><option>info</option><option>debug</option></select><button id="refresh" class="neo-btn">Refresh</button><span id="count" class="u-muted"></span></header><div id="entries" class="entries" role="log" aria-live="polite"></div>
<script>
refresh.onclick=()=>neoWindow.postMessage({refresh:true});filter.onchange=()=>render(last);let last=[];
function render(items){last=items;const selected=filter.value,filtered=items.filter(x=>selected==='all'||x.level===selected).reverse();count.textContent=`${filtered.length} entries`;entries.replaceChildren(...filtered.map(x=>{const row=document.createElement('article');row.className=x.level;for(const value of [new Date(x.t).toLocaleTimeString(),x.level,x.src,x.msg]){const cell=document.createElement('span');cell.textContent=value;cell.className=value===x.level?'u-muted':'';row.append(cell)}return row}))}
neoWindow.onMessage(d=>render(d.entries||[]));
</script>
