<style>.actions{display:flex;gap:4px}.actions button{padding:3px 7px}.app{font-weight:600}.sub{display:block;color:var(--neo-text-muted);font-size:.8rem}.num{text-align:end;font-variant-numeric:tabular-nums}.bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 0}</style>
<div class="bar"><div class="neo-segmented" id="tabs"><button data-t="apps" class="is-active">neoOS apps</button><button data-t="system">This computer</button></div><span id="note" class="u-muted"></span></div>
<div class="u-p-4"><table class="neo-table"><thead id="h"></thead><tbody id="b"></tbody></table></div>
<script>
const $=id=>document.getElementById(id),td=(t,c)=>{const e=document.createElement('td');e.textContent=t;if(c)e.className=c;return e};
let tab='apps';
const heads={apps:['Process','PID','Windows','Uptime','Actions'],system:['Name','PID','User','CPU %','Memory','Actions']};
const mb=n=>(n/1048576).toFixed(n>1e9?0:1)+' MB';
function head(){$('h').replaceChildren(Object.assign(document.createElement('tr'),{innerHTML:heads[tab].map(x=>`<th>${x}</th>`).join('')}))}
document.querySelectorAll('#tabs button').forEach(x=>x.onclick=()=>{tab=x.dataset.t;document.querySelectorAll('#tabs button').forEach(y=>y.classList.toggle('is-active',y===x));head();$('b').replaceChildren();neoWindow.postMessage({tab})});
const btn=(label,cls,fn)=>{const k=document.createElement('button');k.className='neo-btn neo-btn--sm '+cls;k.textContent=label;k.onclick=fn;return k};
neoWindow.onMessage(d=>{
 if(d.error){$('note').textContent=d.error;return}
 if(d.tab!==tab)return;$('note').textContent=d.tab==='system'?`${d.procs.length} of ${d.total} processes, busiest first`:'';
 $('b').replaceChildren(...d.procs.map(p=>{const r=document.createElement('tr'),a=document.createElement('td');a.className='actions';
  if(tab==='apps'){const name=document.createElement('td'),n=document.createElement('span'),i=document.createElement('span');n.className='app';n.textContent=p.name;i.className='sub';i.textContent=p.appId;name.append(n,i);
   a.append(btn('Focus','',()=>neoWindow.postMessage({focus:p.pid})),btn('Minimize','',()=>neoWindow.postMessage({minimize:p.pid})),btn('End','neo-btn--danger',()=>neoWindow.postMessage({kill:p.pid})));
   r.append(name,td(p.pid),td(p.windows),td(Math.round((Date.now()-p.started)/1000)+'s'),a)}
  else{a.append(btn('End','neo-btn--danger',()=>neoWindow.postMessage({killHost:p.pid,name:p.name})));r.append(td(p.name),td(p.pid),td(p.user),td(p.cpu.toFixed(1),'num'),td(mb(p.mem),'num'),a)}
  return r}));
});
head();
</script>
