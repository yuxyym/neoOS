<style>body{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px;text-align:center}
h1{margin:6px 0 0;font-size:1.6rem}.tbl{margin-top:12px;width:100%;max-width:420px}.tbl th{width:34%;color:var(--neo-text-muted)}</style>
<div style="width:84px;height:84px;border-radius:20px;background:linear-gradient(135deg,#6ba0ff,#7a5cff);display:grid;place-items:center" aria-hidden="true"><div style="width:34px;height:34px;background:rgb(255 255 255/.92);transform:rotate(45deg);border-radius:4px"></div></div>
<h1>neoOS <span id="v" class="u-muted" style="font-weight:400"></span></h1><p class="u-muted" style="margin:0">A desktop environment running natively on your computer. Open source (GPL-3.0).</p>
<table class="neo-table tbl"><tbody id="rows"></tbody></table>
<script>
const fmt=n=>{const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<4){n/=1024;i++}return n.toFixed(i>1?1:0)+' '+u[i]};
neoWindow.onMessage(({os,host:h})=>{
 document.getElementById('v').textContent=os.version;
 const rows=[['API',os.api],['Computer',h.hostname],['User',h.username],['System',`${h.osType} ${h.release} (${h.arch})`],['Processor',`${h.cpu.model} × ${h.cpu.count}`],['Memory',fmt(h.totalmem)],['Shell',h.shell||'–'],['Terminal',h.terminal==='node-pty'?'node-pty':h.terminal==='script'?'script(1) fallback':'unavailable'],['Electron',h.versions.electron],['Chromium',h.versions.chrome],['Node.js',h.versions.node],['Screen',screen.width+' × '+screen.height],['Language',navigator.language]];
 document.getElementById('rows').replaceChildren(...rows.map(([k,v])=>{const tr=document.createElement('tr'),a=document.createElement('th'),b=document.createElement('td');a.textContent=k;b.textContent=v;tr.append(a,b);return tr}));
});
</script>
