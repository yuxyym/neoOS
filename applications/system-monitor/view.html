<style>body{height:100vh;display:flex;flex-direction:column;overflow:hidden}.summary{display:flex;gap:12px;padding:12px}.metric{flex:1}.listing{flex:1;overflow:auto;padding:0 12px 12px}.actions{display:flex;gap:4px}.actions button{padding:3px 7px}.sub{color:var(--neo-text-muted);font-size:.8rem}</style>
<div class="summary"><div class="neo-card metric"><div class="u-muted">Processes</div><strong id="count">—</strong></div><div class="neo-card metric"><div class="u-muted">Local storage used</div><strong id="used">—</strong><div id="quota" class="sub"></div></div></div>
<div class="listing"><table class="neo-table"><thead><tr><th>Application</th><th>PID</th><th>Windows</th><th>Uptime</th><th>Controls</th></tr></thead><tbody id="rows"></tbody></table></div><div id="updated" class="sub" style="padding:8px 12px"></div>
<script>
const fmt=n=>{if(!Number.isFinite(n))return 'Unavailable';const u=['B','KB','MB','GB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return `${n.toFixed(i?1:0)} ${u[i]}`};
neoWindow.onMessage(d=>{count.textContent=d.processes.length;used.textContent=d.storage?fmt(d.storage.usage):'Unavailable';quota.textContent=d.storage?`of ${fmt(d.storage.quota)}`:'Browser storage estimate unavailable';rows.replaceChildren(...d.processes.map(p=>{const tr=document.createElement('tr'),app=document.createElement('td'),pid=document.createElement('td'),windows=document.createElement('td'),uptime=document.createElement('td'),actions=document.createElement('td');app.textContent=p.name;pid.textContent=p.pid;windows.textContent=p.windows;uptime.textContent=`${Math.floor((Date.now()-p.started)/1000)}s`;actions.className='actions';for(const [name,action] of [['Focus','focus'],['Minimize','minimize'],['End','kill']]){const b=document.createElement('button');b.className='neo-btn neo-btn--sm '+(action==='kill'?'neo-btn--danger':'');b.textContent=name;b.onclick=()=>neoWindow.postMessage({[action]:p.pid});actions.append(b)}tr.append(app,pid,windows,uptime,actions);return tr}));updated.textContent=`${d.info.name} ${d.info.version} · refreshed ${new Date().toLocaleTimeString()}`});
</script>
